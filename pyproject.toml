[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-live"
version = "0.1.0"
description = "自然语言驱动的 GitOps 云资源运维：AI 只提议，Git 审批，CI 执行"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 只有直连阿里云时才需要，离线走 fixture 不装也能跑
aliyun = ["alibabacloud-ecs20140526>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["reconciler", "reconciler.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
