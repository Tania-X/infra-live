# 期望状态：web-sg 收紧到「只有公司网段能访问 443、只有固定 IP 能 SSH」。
# 这是一份给人 review 的文件：改这里 = 提变更，跑 plan 就能看到差异。
kind: security_group
id: sg-bp1a2b3c4d5e
name: web-sg
region: cn-hangzhou
rules:
  - direction: ingress
    protocol: tcp
    port_range: "22"                 # 写成 22 也会被归一化成 22/22
    source_cidr: 198.51.100.7        # 单 IP 会被归一化成 /32
    action: accept
    priority: 1
    description: "SSH，仅固定出口 IP"

  - direction: ingress
    protocol: tcp
    port_range: "443/443"
    source_cidr: 203.0.113.0/24
    action: accept
    priority: 2
    description: "HTTPS，仅公司网段"

  - direction: ingress
    protocol: tcp
    port_range: 80/80                # 不加引号也行，YAML 会当字符串读
    source_cidr: 0.0.0.0/0
    action: accept
    priority: 3
    description: "HTTP 跳转"
